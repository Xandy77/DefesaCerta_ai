
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Excluir defesa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow mx-auto p-4" style="max-width: 550px;">
        <h2 class="text-danger">Excluir defesa</h2>

        <p>
            Tem certeza de que deseja excluir a defesa do auto
            <strong>{{ defesa.numero_auto }}</strong>,
            referente à placa <strong>{{ defesa.placa }}</strong>?
        </p>

        <p>Esta operação não poderá ser desfeita.</p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Confirmar exclusão
            </button>

            <a href="{% url 'index' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>

</body>
</html>
