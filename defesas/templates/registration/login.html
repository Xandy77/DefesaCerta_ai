
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - DefesaCerta AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow mx-auto p-4" style="max-width: 450px;">
        <h2 class="text-center text-primary">DefesaCerta AI</h2>
        <p class="text-center">Acesse sua conta</p>

        {% if form.errors %}
            <div class="alert alert-danger">
                Usuário ou senha inválidos. Tente novamente.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">
                    Nome de usuário
                </label>
                <input type="text" name="username" id="id_username"
                       class="form-control" required autofocus>
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Senha</label>
                <input type="password" name="password" id="id_password"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            Ainda não tem conta?
            <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>
    </div>
</div>

</body>
</html>
